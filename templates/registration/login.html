{% extends "base.html" %}{% load static %}
{% block titulo %}Entrar · {{ EMPRESA_NOME }}{% endblock %}
{% block corpo %}
<div class="login">
  <div class="card">
    <div class="logo" style="margin:0 0 18px;padding:0"><img alt="{{ EMPRESA_NOME }}" src="{% static 'img/logo.jpg' %}" style="width:100%"></div>
    {% if form.errors %}<div class="erros">Usuário ou senha incorretos.</div>{% endif %}
    <form method="post" class="grid">{% csrf_token %}
      <label>Usuário<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="pri" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
